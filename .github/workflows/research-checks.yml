name: Research checks

on:
  pull_request:
    branches: [main]
  push:
    branches: ['feature/research-workspace']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: research_test
          POSTGRES_PASSWORD: ci-fixture-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RESEARCH_TEST_DATABASE_URL: postgresql://postgres:ci-fixture-only@localhost:5432/research_test
    defaults:
      run:
        working-directory: projects/research-workspace
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r service/requirements.txt
      - name: Migrate an isolated test database
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import psycopg
          with psycopg.connect(os.environ['RESEARCH_TEST_DATABASE_URL'], autocommit=True) as conn:
              conn.execute('CREATE ROLE anon; CREATE ROLE authenticated; CREATE ROLE service_role')
              for name in ['migrations/001_publications.sql', 'migrations/002_source_tables.sql', 'migrations/003_source_views.sql', 'service/migrations/002_queries.sql', 'migrations/005_service_roles.sql']:
                  conn.execute(Path(name).read_text())
          PY
      - run: python -m unittest discover -s data -p test_import.py -v
      - run: python -m unittest solver.test_solver -v
      - run: python -m pytest service -q
