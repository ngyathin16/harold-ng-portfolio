name: Research image build

on:
  push:
    branches: ['feature/research-workspace']
    paths: ['.github/research-image-build-request.json']
  workflow_dispatch:
    inputs:
      project_id:
        description: Reviewed Google Cloud project ID
        required: true
        type: string
      region:
        description: Artifact Registry region
        required: true
        default: asia-southeast1
        type: string
      environment:
        description: Reviewed deployment environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
      retained_storage_bytes:
        description: Reviewed storage bytes still retained, including layers from deleted manifests (0 to 2147483648)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: research-image-build-feature
  cancel-in-progress: false

jobs:
  build:
    if: vars.RESEARCH_ENABLE_IMAGE_BUILDS == 'true' && github.repository == 'ngyathin16/harold-ng-portfolio' && github.ref == 'refs/heads/feature/research-workspace'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      BUILD_PROJECT: ${{ inputs.project_id }}
      BUILD_REGION: ${{ inputs.region }}
      BUILD_ENVIRONMENT: ${{ inputs.environment }}
      BUILD_RETAINED_STORAGE_BYTES: ${{ inputs.retained_storage_bytes }}
      BUILD_WIF_PROVIDER: ${{ vars.RESEARCH_BUILD_WIF_PROVIDER }}
      BUILD_SERVICE_ACCOUNT: ${{ vars.RESEARCH_BUILD_SERVICE_ACCOUNT }}
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - name: Check out the exact requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate destination and clean source
        id: destination
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              path = Path('.github/research-image-build-request.json')
              if not path.is_file():
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                      output.write('enabled=false\n')
                  raise SystemExit(0)
              if path.stat().st_size > 4096:
                  raise SystemExit('Build request exceeds the 4 KiB limit')
              request = json.loads(path.read_text(encoding='utf-8'))
              if not isinstance(request, dict) or set(request) != {'project_id', 'region', 'environment', 'request_id', 'retained_storage_bytes'}:
                  raise SystemExit('Build request must contain exactly project_id, region, environment, request_id, retained_storage_bytes')
              if not all(isinstance(value, str) for value in request.values()):
                  raise SystemExit('Build request fields must be strings')
              project, region, environment = request['project_id'], request['region'], request['environment']
              request_id = request['request_id']
              retained_storage = request['retained_storage_bytes']
          elif os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              project = os.environ['BUILD_PROJECT']
              region = os.environ['BUILD_REGION']
              environment = os.environ['BUILD_ENVIRONMENT']
              request_id = 'manual-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
              retained_storage = os.environ['BUILD_RETAINED_STORAGE_BYTES']
          else:
              raise SystemExit('Unsupported build event')
          if not re.fullmatch(r'0|[1-9][0-9]{0,9}', retained_storage) or int(retained_storage) > 2147483648:
              raise SystemExit('retained_storage_bytes must be a whole integer from 0 to 2147483648')
          retained_storage_bytes = int(retained_storage)
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,79}', request_id):
              raise SystemExit('Invalid build request ID')
          if not re.fullmatch(r'[a-z][a-z0-9-]{4,28}[a-z0-9]', project):
              raise SystemExit('Invalid project ID')
          if not re.fullmatch(r'[a-z]+-[a-z]+[0-9]+', region) or environment not in ('staging', 'production'):
              raise SystemExit('Invalid region or environment')
          expected_account = f'research-{environment}-build@{project}.iam.gserviceaccount.com'
          if os.environ['BUILD_SERVICE_ACCOUNT'] != expected_account:
              raise SystemExit('Configure RESEARCH_BUILD_SERVICE_ACCOUNT for this project and environment')
          provider = os.environ['BUILD_WIF_PROVIDER']
          if not re.fullmatch(r'projects/[0-9]+/locations/global/workloadIdentityPools/research-' + environment + r'-build/providers/github', provider):
              raise SystemExit('Configure RESEARCH_BUILD_WIF_PROVIDER for this environment')
          commit = os.environ['GITHUB_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('Expected a complete source commit')
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != commit:
              raise SystemExit('Checkout differs from requested commit')
          if subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all'], text=True).strip():
              raise SystemExit('Image builds require clean tracked source')
          registry = f'{region}-docker.pkg.dev'
          repository = f'{registry}/{project}/research-{environment}'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'enabled=true\nproject={project}\nregion={region}\nenvironment={environment}\nregistry={registry}\nrepository={repository}\nrequest_id={request_id}\nretained_storage_bytes={retained_storage_bytes}\n')
          PY

      - name: Configure the Linux builder
        if: steps.destination.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the service image locally
        if: steps.destination.outputs.enabled == 'true'
        id: service
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: projects/research-workspace
          file: projects/research-workspace/service/Dockerfile
          target: service
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: ${{ steps.destination.outputs.repository }}/service:${{ github.sha }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_SOURCE_STATE=clean
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.research.source-state=clean
            org.research.download-contract=disabled-v1

      - name: Build the operator image locally
        if: steps.destination.outputs.enabled == 'true'
        id: operator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: projects/research-workspace
          file: projects/research-workspace/service/Dockerfile
          target: operator
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: ${{ steps.destination.outputs.repository }}/operator:${{ github.sha }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_SOURCE_STATE=clean
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.research.source-state=clean
            org.research.download-contract=disabled-v1

      - name: Enforce the reviewed image storage allowance before any push
        if: steps.destination.outputs.enabled == 'true'
        id: size
        env:
          IMAGE_REPOSITORY: ${{ steps.destination.outputs.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          import subprocess
          sizes = {}
          for name in ('service', 'operator'):
              image = os.environ['IMAGE_REPOSITORY'] + '/' + name + ':' + os.environ['GITHUB_SHA']
              sizes[name] = int(subprocess.check_output(['docker', 'image', 'inspect', image, '--format', '{{.Size}}'], text=True))
              if sizes[name] <= 0:
                  raise SystemExit('Image size inspection returned an invalid value')
          total = sum(sizes.values())
          limit = 2147483648
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'Combined uncompressed image size: {total:,} bytes; maximum: {limit:,} bytes.\n\n')
          if total > limit:
              raise SystemExit('Both images exceed the reviewed 2 GiB registry allowance; nothing was pushed')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"service_bytes={sizes['service']}\noperator_bytes={sizes['operator']}\ntotal_bytes={total}\n")
          PY

      - name: Exchange GitHub OIDC for a short-lived build identity
        if: steps.destination.outputs.enabled == 'true'
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.BUILD_WIF_PROVIDER }}
          service_account: ${{ env.BUILD_SERVICE_ACCOUNT }}
          project_id: ${{ steps.destination.outputs.project }}
          token_format: access_token
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false

      - name: Authenticate only to the selected image registry
        if: steps.destination.outputs.enabled == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ steps.destination.outputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Bound aggregate registry storage and retained image count
        if: steps.destination.outputs.enabled == 'true'
        id: registry
        env:
          GOOGLE_BUILD_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          DESTINATION_PROJECT: ${{ steps.destination.outputs.project }}
          DESTINATION_REGION: ${{ steps.destination.outputs.region }}
          DESTINATION_ENVIRONMENT: ${{ steps.destination.outputs.environment }}
          NEW_IMAGE_BYTES: ${{ steps.size.outputs.total_bytes }}
          REVIEWED_RETAINED_STORAGE_BYTES: ${{ steps.destination.outputs.retained_storage_bytes }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          path = '/v1/projects/' + os.environ['DESTINATION_PROJECT'] + '/locations/' + os.environ['DESTINATION_REGION']
          path += '/repositories/research-' + os.environ['DESTINATION_ENVIRONMENT'] + '/dockerImages'
          images = {}
          token = None
          for _ in range(4):
              params = {'pageSize': '100'}
              if token:
                  params['pageToken'] = token
              request = urllib.request.Request('https://artifactregistry.googleapis.com' + path + '?' + urllib.parse.urlencode(params),
                  headers={'Authorization': 'Bearer ' + os.environ['GOOGLE_BUILD_ACCESS_TOKEN']})
              with urllib.request.urlopen(request, timeout=5) as response:
                  page = json.load(response)
              for image in page.get('dockerImages', []):
                  size = int(image['imageSizeBytes'])
                  if size < 0:
                      raise SystemExit('Registry returned an invalid image size')
                  images[image['uri']] = size
              token = page.get('nextPageToken')
              if not token:
                  break
          else:
              raise SystemExit('Registry inventory exceeded its bounded scan; nothing was pushed')
          existing_bytes = sum(images.values())
          retained_floor = int(os.environ['REVIEWED_RETAINED_STORAGE_BYTES'])
          if not 0 <= retained_floor <= 2147483648:
              raise SystemExit('Reviewed retained storage floor is outside the 0 to 2 GiB allowance')
          accounted_existing_bytes = max(existing_bytes, retained_floor)
          projected_bytes = accounted_existing_bytes + int(os.environ['NEW_IMAGE_BYTES'])
          projected_images = len(images) + 2
          if projected_bytes > 2147483648:
              raise SystemExit('Retained storage or observed registry bytes plus this uncompressed image pair exceed the reviewed 2 GiB aggregate allowance; nothing was pushed.')
          if projected_images > 4:
              raise SystemExit('Existing registry images plus this pair exceed the reviewed two-release, four-digest allowance; nothing was pushed. Review retained releases before retrying.')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'existing_bytes={existing_bytes}\nexisting_images={len(images)}\nretained_storage_bytes={retained_floor}\naccounted_existing_bytes={accounted_existing_bytes}\nprojected_bytes={projected_bytes}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'Observed registry image bytes: {existing_bytes:,}; reviewed retained storage floor: {retained_floor:,}; conservative total after this pair: {projected_bytes:,} bytes.\n\n')
          PY

      - name: Push the qualified images and resolve their immutable digests
        if: steps.destination.outputs.enabled == 'true'
        id: push
        env:
          IMAGE_REPOSITORY: ${{ steps.destination.outputs.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import re
          import subprocess
          for name in ('service', 'operator'):
              repository = os.environ['IMAGE_REPOSITORY'] + '/' + name
              image = repository + ':' + os.environ['GITHUB_SHA']
              subprocess.run(['docker', 'push', image], check=True)
              digests = json.loads(subprocess.check_output(['docker', 'image', 'inspect', image, '--format', '{{json .RepoDigests}}'], text=True))
              matches = [value.removeprefix(repository + '@') for value in digests if value.startswith(repository + '@')]
              if len(matches) != 1 or not re.fullmatch(r'sha256:[0-9a-f]{64}', matches[0]):
                  raise SystemExit('Registry did not return one immutable image digest')
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write(name + '_digest=' + matches[0] + '\n')
          PY

      - name: Record immutable image references
        if: steps.destination.outputs.enabled == 'true'
        env:
          BUILD_REQUEST_ID: ${{ steps.destination.outputs.request_id }}
          IMAGE_REPOSITORY: ${{ steps.destination.outputs.repository }}
          SERVICE_DIGEST: ${{ steps.push.outputs.service_digest }}
          OPERATOR_DIGEST: ${{ steps.push.outputs.operator_digest }}
          SERVICE_BYTES: ${{ steps.size.outputs.service_bytes }}
          OPERATOR_BYTES: ${{ steps.size.outputs.operator_bytes }}
          EXISTING_IMAGE_BYTES: ${{ steps.registry.outputs.existing_bytes }}
          EXISTING_IMAGE_COUNT: ${{ steps.registry.outputs.existing_images }}
          RETAINED_STORAGE_BYTES: ${{ steps.registry.outputs.retained_storage_bytes }}
          ACCOUNTED_EXISTING_BYTES: ${{ steps.registry.outputs.accounted_existing_bytes }}
          PROJECTED_IMAGE_BYTES: ${{ steps.registry.outputs.projected_bytes }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          images = {}
          for name in ('service', 'operator'):
              digest = os.environ[name.upper() + '_DIGEST']
              if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
                  raise SystemExit('Builder did not return an immutable image digest')
              images[name] = os.environ['IMAGE_REPOSITORY'] + '/' + name + '@' + digest
          report = {'app_commit': os.environ['GITHUB_SHA'], 'source_state': 'clean',
                    'platform': 'linux/amd64', 'images': images,
                    'request_id': os.environ['BUILD_REQUEST_ID'],
                    'uncompressed_image_bytes': {name: int(os.environ[name.upper() + '_BYTES']) for name in ('service', 'operator')},
                    'maximum_combined_image_bytes': 2147483648,
                    'existing_registry_image_bytes': int(os.environ['EXISTING_IMAGE_BYTES']),
                    'existing_registry_image_count': int(os.environ['EXISTING_IMAGE_COUNT']),
                    'retained_storage_bytes': int(os.environ['RETAINED_STORAGE_BYTES']),
                    'accounted_existing_storage_bytes': int(os.environ['ACCOUNTED_EXISTING_BYTES']),
                    'projected_registry_storage_bytes': int(os.environ['PROJECTED_IMAGE_BYTES']),
                    'maximum_retained_image_digests': 4,
                    'workflow_run_id': os.environ['GITHUB_RUN_ID'],
                    'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT']}
          Path('image-digests.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('Source commit: `' + report['app_commit'] + '`\n\n')
              summary.write('Platform: `linux/amd64`\n\n')
              for name, image in images.items():
                  summary.write('- ' + name + ': `' + image + '`\n')
          PY

      - name: Preserve the small digest report
        if: steps.destination.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-image-digests-${{ github.sha }}-${{ github.run_attempt }}
          path: image-digests.json
          if-no-files-found: error
          retention-days: 1
