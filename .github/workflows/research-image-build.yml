name: Research image build

on:
  push:
    branches: ['feature/research-workspace']
    paths: ['.github/research-image-build-request.json']
  workflow_dispatch:
    inputs:
      project_id:
        description: Reviewed Google Cloud project ID
        required: true
        type: string
      region:
        description: Artifact Registry region
        required: true
        default: asia-southeast1
        type: string
      environment:
        description: Reviewed deployment environment
        required: true
        default: staging
        type: choice
        options: [staging, production]
      retained_storage_bytes:
        description: Reviewed storage bytes still retained, including layers from deleted manifests (0 to 2147483648)
        required: true
        type: string
      components:
        description: Reviewed components to build and upload
        required: false
        default: service,operator
        type: choice
        options: ['service,operator', service, operator]

permissions:
  contents: read

concurrency:
  group: research-image-build-feature
  cancel-in-progress: false

jobs:
  build:
    if: vars.RESEARCH_ENABLE_IMAGE_BUILDS == 'true' && github.repository == 'ngyathin16/harold-ng-portfolio' && github.ref == 'refs/heads/feature/research-workspace'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
    env:
      BUILD_PROJECT: ${{ inputs.project_id }}
      BUILD_REGION: ${{ inputs.region }}
      BUILD_ENVIRONMENT: ${{ inputs.environment }}
      BUILD_RETAINED_STORAGE_BYTES: ${{ inputs.retained_storage_bytes }}
      BUILD_COMPONENTS: ${{ inputs.components }}
      BUILD_WIF_PROVIDER: ${{ vars.RESEARCH_BUILD_WIF_PROVIDER }}
      BUILD_SERVICE_ACCOUNT: ${{ vars.RESEARCH_BUILD_SERVICE_ACCOUNT }}
      DOCKER_BUILD_RECORD_UPLOAD: 'false'
    steps:
      - name: Check out the exact requested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate destination and clean source
        id: destination
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import sys
          if os.environ.get('GITHUB_RUN_ATTEMPT') != '1':
              raise SystemExit('Build reruns are blocked: review any prior uploads and retained storage, then submit a new reviewed build request.')
          sys.path.insert(0, 'projects/research-workspace')
          from deploy.image_artifact import COMPONENTS, parse_json, selected_components
          if os.environ['GITHUB_EVENT_NAME'] == 'push':
              path = Path('.github/research-image-build-request.json')
              if not path.is_file():
                  with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                      output.write('enabled=false\n')
                  raise SystemExit(0)
              if path.stat().st_size > 4096:
                  raise SystemExit('Build request exceeds the 4 KiB limit')
              request = parse_json(path.read_bytes())
              required = {'project_id', 'region', 'environment', 'request_id', 'retained_storage_bytes'}
              if not isinstance(request, dict) or not required <= set(request) or set(request) - required - {'components'}:
                  raise SystemExit('Build request must contain the five destination fields and optional components')
              if not all(isinstance(request[key], str) for key in required):
                  raise SystemExit('Build request fields must be strings')
              components = selected_components(request.get('components', COMPONENTS))
              project, region, environment = request['project_id'], request['region'], request['environment']
              request_id = request['request_id']
              retained_storage = request['retained_storage_bytes']
          elif os.environ['GITHUB_EVENT_NAME'] == 'workflow_dispatch':
              project = os.environ['BUILD_PROJECT']
              region = os.environ['BUILD_REGION']
              environment = os.environ['BUILD_ENVIRONMENT']
              request_id = 'manual-' + os.environ['GITHUB_RUN_ID'] + '-' + os.environ['GITHUB_RUN_ATTEMPT']
              retained_storage = os.environ['BUILD_RETAINED_STORAGE_BYTES']
              components = selected_components(os.environ.get('BUILD_COMPONENTS', 'service,operator').split(','))
          else:
              raise SystemExit('Unsupported build event')
          if not re.fullmatch(r'0|[1-9][0-9]{0,9}', retained_storage) or int(retained_storage) > 2147483648:
              raise SystemExit('retained_storage_bytes must be a whole integer from 0 to 2147483648')
          retained_storage_bytes = int(retained_storage)
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9._-]{0,79}', request_id):
              raise SystemExit('Invalid build request ID')
          if not re.fullmatch(r'[a-z][a-z0-9-]{4,28}[a-z0-9]', project):
              raise SystemExit('Invalid project ID')
          if not re.fullmatch(r'[a-z]+-[a-z]+[0-9]+', region) or environment not in ('staging', 'production'):
              raise SystemExit('Invalid region or environment')
          expected_account = f'research-{environment}-build@{project}.iam.gserviceaccount.com'
          if os.environ['BUILD_SERVICE_ACCOUNT'] != expected_account:
              raise SystemExit('Configure RESEARCH_BUILD_SERVICE_ACCOUNT for this project and environment')
          provider = os.environ['BUILD_WIF_PROVIDER']
          if not re.fullmatch(r'projects/[0-9]+/locations/global/workloadIdentityPools/research-' + environment + r'-build/providers/github', provider):
              raise SystemExit('Configure RESEARCH_BUILD_WIF_PROVIDER for this environment')
          commit = os.environ['GITHUB_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', commit):
              raise SystemExit('Expected a complete source commit')
          if subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() != commit:
              raise SystemExit('Checkout differs from requested commit')
          if subprocess.check_output(['git', 'status', '--porcelain', '--untracked-files=all'], text=True).strip():
              raise SystemExit('Image builds require clean tracked source')
          registry = f'{region}-docker.pkg.dev'
          repository = f'{registry}/{project}/research-{environment}'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f'enabled=true\nproject={project}\nregion={region}\nenvironment={environment}\nregistry={registry}\nrepository={repository}\nrequest_id={request_id}\nretained_storage_bytes={retained_storage_bytes}\n')
              output.write('components=' + json.dumps(components, separators=(',', ':')) + '\n')
          PY

      - name: Configure the Linux builder
        if: steps.destination.outputs.enabled == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the service image locally
        if: steps.destination.outputs.enabled == 'true' && contains(fromJSON(steps.destination.outputs.components), 'service')
        id: service
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: projects/research-workspace
          file: projects/research-workspace/service/Dockerfile
          target: service
          platforms: linux/amd64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/research-service.oci.tar,oci-mediatypes=true,compression=gzip,force-compression=true
          provenance: false
          sbom: false
          tags: ${{ steps.destination.outputs.repository }}/service:${{ github.sha }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_SOURCE_STATE=clean
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.research.source-state=clean
            org.research.download-contract=disabled-v1

      - name: Build the operator image locally
        if: steps.destination.outputs.enabled == 'true' && contains(fromJSON(steps.destination.outputs.components), 'operator')
        id: operator
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: projects/research-workspace
          file: projects/research-workspace/service/Dockerfile
          target: operator
          platforms: linux/amd64
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/research-operator.oci.tar,oci-mediatypes=true,compression=gzip,force-compression=true
          provenance: false
          sbom: false
          tags: ${{ steps.destination.outputs.repository }}/operator:${{ github.sha }}
          build-args: |
            APP_COMMIT=${{ github.sha }}
            APP_SOURCE_STATE=clean
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.research.source-state=clean
            org.research.download-contract=disabled-v1

      - name: Validate selected exact archives before registry authentication
        if: steps.destination.outputs.enabled == 'true'
        id: size
        env:
          IMAGE_REPOSITORY: ${{ steps.destination.outputs.repository }}
          SELECTED_COMPONENTS: ${{ steps.destination.outputs.components }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          sys.path.insert(0, 'projects/research-workspace')
          from deploy.image_artifact import selected_components, validate_components
          selected = selected_components(json.loads(os.environ['SELECTED_COMPONENTS']))
          paths = {name: Path(os.environ['RUNNER_TEMP']) / ('research-' + name + '.oci.tar') for name in selected}
          report = validate_components(paths, os.environ['IMAGE_REPOSITORY'], os.environ['GITHUB_SHA'], selected)
          Path('image-artifacts.json').write_text(json.dumps(report, indent=2) + '\n')
          sizes = {name: item['uncompressed_layer_bytes'] for name, item in report['artifacts'].items()}
          archives = {name: item['archive_bytes'] for name, item in report['artifacts'].items()}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f'Exact compressed archive bytes: {sum(archives.values()):,}; uncompressed layer bytes: {sum(sizes.values()):,}. Each total is independently limited to 2 GiB.\n\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for name, size in sizes.items():
                  output.write(f'{name}_bytes={size}\n')
              output.write(f'total_bytes={sum(archives.values())}\n')
          PY

      - name: Prove digest-preserving local copy compatibility
        if: steps.destination.outputs.enabled == 'true'
        env:
          SELECTED_COMPONENTS: ${{ steps.destination.outputs.components }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, 'projects/research-workspace')
          from deploy.image_artifact import check_archive, report_components, require, selected_components, verify_copy_directory
          path = Path('image-artifacts.json')
          report = json.loads(path.read_text())
          selected = selected_components(json.loads(os.environ['SELECTED_COMPONENTS']))
          require(report_components(report) == selected, 'Local copy component selection differs')
          for name in selected:
              archive = Path(os.environ['RUNNER_TEMP']) / ('research-' + name + '.oci.tar')
              target = Path(os.environ['RUNNER_TEMP']) / ('research-' + name + '-copy')
              check_archive(archive, report['artifacts'][name])
              subprocess.run(['skopeo', 'copy', '--preserve-digests', '--retry-times', '0',
                  'oci-archive:' + str(archive) + ':' + os.environ['GITHUB_SHA'], 'dir:' + str(target)], check=True, timeout=300)
              verify_copy_directory(target, report['artifacts'][name])
          report.update(copy_verified=True, skopeo_version=subprocess.check_output(['skopeo', '--version'], text=True).strip()
              + '; package ' + subprocess.check_output(['dpkg-query', '-W', '-f=${Version}', 'skopeo'], text=True).strip())
          path.write_text(json.dumps(report, indent=2) + '\n')
          PY

      - name: Exchange GitHub OIDC for a short-lived build identity
        if: steps.destination.outputs.enabled == 'true'
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ env.BUILD_WIF_PROVIDER }}
          service_account: ${{ env.BUILD_SERVICE_ACCOUNT }}
          project_id: ${{ steps.destination.outputs.project }}
          token_format: access_token
          access_token_lifetime: 1800s
          create_credentials_file: false
          export_environment_variables: false

      - name: Authenticate only to the selected image registry
        if: steps.destination.outputs.enabled == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ steps.destination.outputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - name: Bound aggregate registry storage and retained image count
        if: steps.destination.outputs.enabled == 'true'
        id: registry
        env:
          GOOGLE_BUILD_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          DESTINATION_PROJECT: ${{ steps.destination.outputs.project }}
          DESTINATION_REGION: ${{ steps.destination.outputs.region }}
          DESTINATION_ENVIRONMENT: ${{ steps.destination.outputs.environment }}
          REVIEWED_RETAINED_STORAGE_BYTES: ${{ steps.destination.outputs.retained_storage_bytes }}
          SELECTED_COMPONENTS: ${{ steps.destination.outputs.components }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          import urllib.parse
          import urllib.request
          sys.path.insert(0, 'projects/research-workspace')
          from deploy.image_artifact import report_components, require, selected_components, storage_projection
          report = json.loads(Path('image-artifacts.json').read_text())
          require(report_components(report) == selected_components(json.loads(os.environ['SELECTED_COMPONENTS'])), 'Storage component selection differs')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise RuntimeError('Registry inventory redirected outside the reviewed request')
          opener = urllib.request.build_opener(NoRedirect)
          path = '/v1/projects/' + os.environ['DESTINATION_PROJECT'] + '/locations/' + os.environ['DESTINATION_REGION']
          path += '/repositories/research-' + os.environ['DESTINATION_ENVIRONMENT'] + '/dockerImages'
          images = {}
          token = None
          for _ in range(4):
              params = {'pageSize': '100'}
              if token:
                  params['pageToken'] = token
              request = urllib.request.Request('https://artifactregistry.googleapis.com' + path + '?' + urllib.parse.urlencode(params),
                  headers={'Authorization': 'Bearer ' + os.environ['GOOGLE_BUILD_ACCESS_TOKEN']})
              with opener.open(request, timeout=5) as response:
                  raw = response.read(1048577)
                  if len(raw) > 1048576:
                      raise SystemExit('Registry inventory response exceeds 1 MiB')
                  page = json.loads(raw)
              for image in page.get('dockerImages', []):
                  size = int(image['imageSizeBytes'])
                  if size < 0 or image.get('imageManifests'):
                      raise SystemExit('Registry returned an invalid image size')
                  if not image['uri'].startswith(os.environ['DESTINATION_REGION'] + '-docker.pkg.dev/' + os.environ['DESTINATION_PROJECT'] + '/research-' + os.environ['DESTINATION_ENVIRONMENT'] + '/'):
                      raise SystemExit('Registry inventory contains an unexpected image location')
                  if image['uri'] in images:
                      raise SystemExit('Registry inventory repeated a digest')
                  images[image['uri']] = size
              token = page.get('nextPageToken')
              if not token:
                  break
          else:
              raise SystemExit('Registry inventory exceeded its bounded scan; nothing was pushed')
          projection = storage_projection(images, int(os.environ['REVIEWED_RETAINED_STORAGE_BYTES']), report)
          report['registry_projection'] = projection
          Path('image-artifacts.json').write_text(json.dumps(report, indent=2) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for key, value in projection.items():
                  output.write(f'{key}={value}\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(f"Observed registry bytes: {projection['existing_bytes']:,}; retained floor: {projection['retained_storage_bytes']:,}; conservative total with selected complete archives: {projection['projected_bytes']:,} bytes.\n\n")
          PY

      - name: Push the qualified images and resolve their immutable digests
        if: steps.destination.outputs.enabled == 'true'
        id: push
        env:
          IMAGE_REPOSITORY: ${{ steps.destination.outputs.repository }}
          SELECTED_COMPONENTS: ${{ steps.destination.outputs.components }}
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime, timezone
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, 'projects/research-workspace')
          from deploy.image_artifact import check_archive, report_components, require, selected_components
          path = Path('image-artifacts.json')
          report = json.loads(path.read_text())
          require(report['repository'] == os.environ['IMAGE_REPOSITORY'] and report['app_commit'] == os.environ['GITHUB_SHA'], 'Qualified image identity differs')
          require(report['copy_verified'] and 'registry_projection' in report and not report.get('upload_intents'), 'Upload requires completed local and storage qualification without a previous intent')
          selected = selected_components(json.loads(os.environ['SELECTED_COMPONENTS']))
          require(report_components(report) == selected, 'Upload component selection differs')
          for name in selected:
              check_archive(Path(os.environ['RUNNER_TEMP']) / ('research-' + name + '.oci.tar'), report['artifacts'][name])
          for name in selected:
              repository = os.environ['IMAGE_REPOSITORY'] + '/' + name
              image = repository + ':' + os.environ['GITHUB_SHA']
              archive = Path(os.environ['RUNNER_TEMP']) / ('research-' + name + '.oci.tar')
              check_archive(archive, report['artifacts'][name])
              report.setdefault('upload_intents', {})[name] = {'image': image, 'started_at': datetime.now(timezone.utc).isoformat()}
              path.write_text(json.dumps(report, indent=2) + '\n')
              digest_path = Path(os.environ['RUNNER_TEMP']) / (name + '-pushed-digest.txt')
              subprocess.run(['skopeo', 'copy', '--preserve-digests', '--retry-times', '0',
                  '--dest-authfile', str(Path.home() / '.docker/config.json'), '--digestfile', str(digest_path),
                  'oci-archive:' + str(archive) + ':' + os.environ['GITHUB_SHA'], 'docker://' + image], check=True, timeout=300)
              digest = digest_path.read_text().strip()
              require(digest == report['artifacts'][name]['manifest_digest'], 'Pushed digest differs from the qualified archive')
              report['upload_intents'][name]['verified_digest'] = digest
              path.write_text(json.dumps(report, indent=2) + '\n')
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
                  output.write(name + '_digest=' + digest + '\n')
          PY

      - name: Record immutable image references
        if: steps.destination.outputs.enabled == 'true'
        env:
          BUILD_REQUEST_ID: ${{ steps.destination.outputs.request_id }}
          IMAGE_REPOSITORY: ${{ steps.destination.outputs.repository }}
          SELECTED_COMPONENTS: ${{ steps.destination.outputs.components }}
          SERVICE_DIGEST: ${{ steps.push.outputs.service_digest }}
          OPERATOR_DIGEST: ${{ steps.push.outputs.operator_digest }}
          EXISTING_IMAGE_BYTES: ${{ steps.registry.outputs.existing_bytes }}
          EXISTING_IMAGE_COUNT: ${{ steps.registry.outputs.existing_images }}
          RETAINED_STORAGE_BYTES: ${{ steps.registry.outputs.retained_storage_bytes }}
          ACCOUNTED_EXISTING_BYTES: ${{ steps.registry.outputs.accounted_existing_bytes }}
          PROJECTED_IMAGE_BYTES: ${{ steps.registry.outputs.projected_bytes }}
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import sys
          sys.path.insert(0, 'projects/research-workspace')
          from deploy.image_artifact import COMPONENTS, report_components, require, selected_components
          qualified = json.loads(Path('image-artifacts.json').read_text())
          selected = selected_components(json.loads(os.environ['SELECTED_COMPONENTS']))
          require(report_components(qualified) == selected and set(qualified.get('upload_intents', {})) == set(selected),
              'Recorded uploads differ from reviewed components')
          images = {}
          for name in selected:
              digest = os.environ[name.upper() + '_DIGEST']
              if not re.fullmatch(r'sha256:[0-9a-f]{64}', digest):
                  raise SystemExit('Builder did not return an immutable image digest')
              require(digest == qualified['artifacts'][name]['manifest_digest'] == qualified['upload_intents'][name].get('verified_digest'),
                  'Recorded upload digest differs from qualified archive')
              images[name] = os.environ['IMAGE_REPOSITORY'] + '/' + name + '@' + digest
          report = {'schema_version': 2, 'app_commit': os.environ['GITHUB_SHA'], 'source_state': 'clean',
                    'platform': 'linux/amd64', 'images': images,
                    'request_id': os.environ['BUILD_REQUEST_ID'],
                    'uncompressed_image_bytes': {name: qualified['artifacts'][name]['uncompressed_layer_bytes'] for name in selected},
                    'uncompressed_measurement': 'Sum of gzip-expanded layer stream bytes, including repeated references',
                    'maximum_combined_image_bytes': 2147483648,
                    'storage_accounting': qualified['storage_accounting'],
                    'compressed_archive_bytes': {name: item['archive_bytes'] for name, item in qualified['artifacts'].items()},
                    'archive_sha256': {name: item['archive_sha256'] for name, item in qualified['artifacts'].items()},
                    'archive_artifacts': qualified['artifacts'],
                    'local_copy_verified': qualified['copy_verified'],
                    'skopeo_version': qualified['skopeo_version'],
                    'existing_registry_image_bytes': int(os.environ['EXISTING_IMAGE_BYTES']),
                    'existing_registry_image_count': int(os.environ['EXISTING_IMAGE_COUNT']),
                    'retained_storage_bytes': int(os.environ['RETAINED_STORAGE_BYTES']),
                    'accounted_existing_storage_bytes': int(os.environ['ACCOUNTED_EXISTING_BYTES']),
                    'projected_registry_storage_bytes': int(os.environ['PROJECTED_IMAGE_BYTES']),
                    'maximum_retained_image_digests': 4,
                    'workflow_run_id': os.environ['GITHUB_RUN_ID'],
                    'workflow_run_attempt': os.environ['GITHUB_RUN_ATTEMPT']}
          if selected != COMPONENTS:
              report.update(schema_version=3, components=selected)
          Path('image-digests.json').write_text(json.dumps(report, indent=2) + '\n', encoding='utf-8')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('Source commit: `' + report['app_commit'] + '`\n\n')
              summary.write('Platform: `linux/amd64`\n\n')
              for name, image in images.items():
                  summary.write('- ' + name + ': `' + image + '`\n')
          PY

      - name: Preserve digest and storage records, including uncertain uploads
        if: always() && steps.destination.outputs.enabled == 'true' && steps.size.outcome == 'success'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-image-digests-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            image-digests.json
            image-artifacts.json
          if-no-files-found: error
          retention-days: 1
